<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" width="100%" height="6" preserveAspectRatio="none" role="img" aria-label="Animated divider">
  <!--
    Thin animated section divider. A gradient sweeps left-to-right across
    a transparent bar, cycling continuously. The colors are the Shinka
    portfolio palette: magenta → cyan → lime. Subtle motion that ties
    every section to the brand.
  -->
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF00FF" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#FF00FF" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#00FFFF" stop-opacity="0.85"/>
      <stop offset="65%"  stop-color="#B8FF00" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#B8FF00" stop-opacity="0"/>
      <animate attributeName="x1" values="-1.2;1.2" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-0.2;2.2" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="1" width="1200" height="4" rx="2" fill="url(#sweep)"/>
</svg>

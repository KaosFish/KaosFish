<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" preserveAspectRatio="none" role="img" aria-label="Cherry blossom petals drifting">
  <!--
    Cherry blossom drift. 14 petals at varied positions, sizes, speeds, delays.
    Each petal is its own <g> with two animations:
      1. <animateMotion> moves it along a gentle curved path top→bottom
      2. <animateTransform type="rotate"> spins it as it falls
    Pure SVG SMIL — no JS, no external deps. Plays in every modern browser
    that renders SVG, including GitHub's README image proxy.
  -->
  <defs>
    <path id="petal" d="M0 -10 C 7 -5, 9 5, 0 10 C -9 5, -7 -5, 0 -10 Z"/>
  </defs>

  <g>
    <use href="#petal" fill="#FFCBD3" opacity="0.9">
      <animateMotion dur="9s" repeatCount="indefinite" path="M 60 -20 Q 90 90 80 230"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <use href="#petal" fill="#FFB6C1" opacity="0.85" transform="scale(1.4)">
      <animateMotion dur="11s" begin="-2s" repeatCount="indefinite" path="M 160 -25 Q 200 100 180 230"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="7s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <use href="#petal" fill="#FFE0E6" opacity="0.95" transform="scale(0.9)">
      <animateMotion dur="8s" begin="-4s" repeatCount="indefinite" path="M 260 -15 Q 290 80 310 230"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <use href="#petal" fill="#FFCBD3" opacity="0.8" transform="scale(1.2)">
      <animateMotion dur="12s" begin="-1s" repeatCount="indefinite" path="M 360 -30 Q 400 120 380 240"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="8s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <use href="#petal" fill="#FFD9DE" opacity="0.9">
      <animateMotion dur="10s" begin="-6s" repeatCount="indefinite" path="M 460 -20 Q 490 100 480 230"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <use href="#petal" fill="#FFB6C1" opacity="0.85" transform="scale(1.1)">
      <animateMotion dur="9.5s" begin="-3s" repeatCount="indefinite" path="M 560 -25 Q 600 90 580 230"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="5.5s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <use href="#petal" fill="#FFE0E6" opacity="0.95" transform="scale(0.8)">
      <animateMotion dur="7s" begin="-5s" repeatCount="indefinite" path="M 660 -15 Q 690 80 700 220"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.5s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <use href="#petal" fill="#FFCBD3" opacity="0.9" transform="scale(1.3)">
      <animateMotion dur="11.5s" begin="-7s" repeatCount="indefinite" path="M 760 -25 Q 790 110 780 235"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="7.5s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <use href="#petal" fill="#FFD9DE" opacity="0.85">
      <animateMotion dur="8.5s" begin="-2s" repeatCount="indefinite" path="M 860 -20 Q 890 90 880 230"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.5s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <use href="#petal" fill="#FFB6C1" opacity="0.9" transform="scale(1.2)">
      <animateMotion dur="10.5s" begin="-4s" repeatCount="indefinite" path="M 960 -30 Q 1000 100 980 230"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="6.5s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <use href="#petal" fill="#FFE0E6" opacity="0.95" transform="scale(0.9)">
      <animateMotion dur="9s" begin="-6s" repeatCount="indefinite" path="M 1060 -15 Q 1090 80 1080 220"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <use href="#petal" fill="#FFCBD3" opacity="0.85" transform="scale(1.1)">
      <animateMotion dur="12s" begin="-1s" repeatCount="indefinite" path="M 1140 -20 Q 1170 110 1150 230"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="7s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <use href="#petal" fill="#FFD9DE" opacity="0.9" transform="scale(1.4)">
      <animateMotion dur="13s" begin="-8s" repeatCount="indefinite" path="M 410 -30 Q 450 130 430 240"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8.5s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <use href="#petal" fill="#FFB6C1" opacity="0.8">
      <animateMotion dur="9.5s" begin="-5s" repeatCount="indefinite" path="M 810 -20 Q 850 90 830 230"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="5s" repeatCount="indefinite"/>
    </use>
  </g>
</svg>

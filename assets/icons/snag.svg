<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    Snag logo mark — caramel pillow with cream download arrow.
    Colors lifted directly from the cafe-theme tokens in styles.css:
      pillow  = #C48A4A  (caramel — primary action)
      border  = #3A2310  (deep brown — borderhi)
      arrow   = #F8E9CC  (warm cream — bg)
  -->
  <rect x="6" y="6" width="116" height="116" rx="40" ry="40"
        fill="#C48A4A" stroke="#3A2310" stroke-width="6"/>
  <g stroke="#F8E9CC" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M64 24 L64 76"/>
    <path d="M32 60 L64 92 L96 60"/>
    <path d="M32 108 L96 108"/>
  </g>
</svg>
